<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이메일 인증 — CareBaby</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fefcf9;
      color: #1a1a1a;
      line-height: 1.7;
      min-height: 100vh;
      padding: 40px 20px 80px;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
    }
    .brand {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fe9bb0;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: 0;
      margin-bottom: 10px;
    }
    p {
      font-size: 0.96rem;
      color: #333;
      margin-bottom: 10px;
    }
    .panel {
      background: #fff8f0;
      border-left: 3px solid #fe9bb0;
      border-radius: 4px;
      margin: 28px 0 18px;
      padding: 16px 18px;
    }
    .status {
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
    }
    .hint {
      color: #666;
      font-size: 0.9rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 0 18px;
      border-radius: 4px;
      background: #fe9bb0;
      color: #fff;
      font-size: 0.96rem;
      font-weight: 700;
      text-decoration: none;
      border: 0;
      cursor: pointer;
    }
    .button.secondary {
      background: transparent;
      color: #555;
      border: 1px solid #ddd5cf;
    }
    .meta {
      color: #888;
      font-size: 0.84rem;
      margin-top: 28px;
    }
    @media (min-width: 560px) {
      body { padding-top: 64px; }
      .actions { max-width: 320px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">CareBaby</div>
  <h1>이메일 인증이 완료됐어요</h1>
  <p>CareBaby 앱으로 돌아가서 <strong>이메일 인증 완료</strong> 버튼을 눌러주세요.</p>

  <div class="panel">
    <div class="status" id="status">인증이 처리됐습니다</div>
    <p class="hint" id="hint">모바일에서 열었다면 잠시 뒤 앱으로 이동합니다.</p>
  </div>

  <div class="actions">
    <a class="button" id="open-app" href="#">CareBaby 열기</a>
    <a class="button secondary" href="support.html">고객 지원 보기</a>
  </div>

  <p class="meta" id="meta">PC에서 인증했다면 앱으로 돌아가 완료 버튼을 눌러주세요.</p>
</div>

<script>
  (function () {
    var appUrl = 'carebaby://auth/callback' + window.location.search + window.location.hash;
    var openButton = document.getElementById('open-app');
    var status = document.getElementById('status');
    var hint = document.getElementById('hint');
    var meta = document.getElementById('meta');
    var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    openButton.setAttribute('href', appUrl);

    if (!window.location.hash && !window.location.search) {
      status.textContent = '인증 정보를 찾지 못했어요';
      hint.textContent = '메일의 인증 버튼을 다시 눌러주세요.';
      return;
    }

    if (!isMobile) {
      status.textContent = '인증이 완료됐어요';
      hint.textContent = '이제 CareBaby 앱으로 돌아가 완료 버튼을 눌러주세요.';
      meta.textContent = '이 브라우저 화면은 닫아도 됩니다.';
      return;
    }

    window.setTimeout(function () {
      window.location.href = appUrl;
    }, 250);
  }());
</script>
</body>
</html>
